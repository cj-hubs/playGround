<!-- element vs tags -->
<html> 
    <!-- head contains the meta data of the page -->
    <head>
        <title>
            First page
        </title>
    </head>


    <!-- the content of the page -->
    <body>
        <h1>
            Hello world!
        </h1>
        <p>
            This is my first page
        </p>
    </body>
</html>
